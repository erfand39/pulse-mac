name: Pulse Mac ARM64

on:
  workflow_dispatch:
  push:
    branches: [main, mac-personal]
  pull_request:

permissions:
  contents: read

jobs:
  mac-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run dist:mac:arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: bash scripts/verify-mac.sh
      - run: env PULSE_PACKAGE_SMOKE=1 "dist/mac-arm64/Pulse Mac.app/Contents/MacOS/Pulse Mac"
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-mac-arm64
          path: |
            dist/Pulse-Mac-*-arm64.dmg
            dist/Pulse-Mac-*-arm64.zip
          if-no-files-found: error
